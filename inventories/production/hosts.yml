---
# Production inventory. One file per environment, each with its own
# group_vars, so `-i inventories/production` is the only thing that decides
# which machines a playbook can reach. There is no way to "accidentally" hit
# production from the dev inventory, which is the entire reason for the split.
all:
  children:
    web:
      hosts:
        web-01.prod.internal:
          # Canary. Rolling plays promote this host into its own first batch.
          deploy_canary: true
        web-02.prod.internal:
        web-03.prod.internal:
        web-04.prod.internal:
    db:
      hosts:
        db-01.prod.internal:
          postgres_role: primary
        db-02.prod.internal:
          postgres_role: replica
    lb:
      hosts:
        lb-01.prod.internal:
    # A group of groups: targets every application host without listing them.
    app:
      children:
        web:
        db:
