---
# Dev inventory. Points at localhost so the whole repository can be exercised
# with `--check` or against containers without any infrastructure at all:
#
#   ansible-playbook -i inventories/dev playbooks/site.yml --check --diff
all:
  children:
    web:
      hosts:
        localhost:
          deploy_canary: true
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    db:
      hosts:
        localhost:
          postgres_role: primary
    app:
      children:
        web:
        db:
