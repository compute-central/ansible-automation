---
# Molecule converges this role inside a container, runs it a second time to
# prove idempotence, and then asserts the result. Running it twice is the part
# that matters: a role that reports "changed" on every run is not idempotent,
# and in practice that means it is restarting a service on every run too.
#
#   cd roles/nginx && molecule test
#   cd roles/nginx && molecule converge   # leave the container up to poke at
#   cd roles/nginx && molecule login
dependency:
  name: galaxy
  options:
    # Relative to this scenario directory: default -> molecule -> nginx ->
    # roles -> repository root.
    requirements-file: ../../../../requirements.yml

driver:
  name: docker

platforms:
  # Two distribution families, because this role branches on os_family and a
  # test on one family would not exercise the other path at all.
  - name: nginx-debian
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

  - name: nginx-rocky
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: /usr/lib/systemd/systemd
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      # `stdout_callback: yaml` meant community.general.yaml, which was removed
      # in community.general 12. The built-in default callback with
      # result_format set does the same job and needs no collection, which
      # matters here because molecule's own create/destroy playbooks run
      # before any collection is installed.
      stdout_callback: default
      result_format: yaml
    ssh_connection:
      pipelining: false   # not available over the docker connection plugin
  inventory:
    group_vars:
      all:
        nginx_app_name: molecule
        nginx_listen_port: 8080
        nginx_upstreams:
          - 127.0.0.1:9000
        nginx_rate_limit_enabled: true
        # The upstream does not exist in the container, so skip the proxy
        # health probe; verify.yml checks the port and the nginx-served
        # health endpoint instead.
        nginx_verify_after_converge: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
