---
# Molecule lives at the project root, not inside the role.
#
# A scenario nested in `roles/nginx/molecule/` cannot resolve `nginx` as a
# role: molecule treats the role directory as the project root, so the
# repository's own `roles/` is not on the search path. At the root, the
# `roles_path = roles` from ansible.cfg applies and the role is found.
#
#   molecule test        # create, converge, converge again, verify, destroy
#   molecule converge    # leave the containers up to poke at
#   molecule login -h nginx-debian
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  # Two distribution families, because the role branches on os_family and a
  # test against one family does not exercise the other path at all.
  - name: nginx-debian
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

  - name: nginx-rocky
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: /usr/lib/systemd/systemd
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  # Molecule generates its own ansible.cfg in an ephemeral directory and runs
  # from there, so the repository's ansible.cfg -- and its roles_path, library
  # and filter_plugins -- never applies. Without these three the role is
  # searched for in molecule/default/roles and not found.
  #
  # ${MOLECULE_PROJECT_DIRECTORY} is expanded by molecule to the directory
  # containing the molecule/ tree, which is the repository root.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_LIBRARY: ${MOLECULE_PROJECT_DIRECTORY}/plugins/modules
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/plugins/filter
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      # `stdout_callback: yaml` used to mean community.general.yaml, which was
      # removed in community.general 12. The built-in default callback with
      # result_format set needs no collection at all -- which matters because
      # molecule's create and destroy playbooks run before the dependency
      # step has installed anything.
      stdout_callback: default
      result_format: yaml
    ssh_connection:
      # Not applicable to the docker connection plugin.
      pipelining: false
  inventory:
    group_vars:
      all:
        # Connect as root. The docker connection plugin otherwise uses the
        # image's default user, and sudo in the Rocky image demands a password:
        #   "account management error: Authentication service cannot retrieve
        #    authentication info / sudo: a password is required"
        # Ansible skips escalation entirely when the connection user already
        # equals become_user, so `become: true` in converge.yml stays correct
        # and simply becomes a no-op here.
        ansible_user: root

        nginx_app_name: molecule
        nginx_listen_port: 8080
        nginx_upstreams:
          - 127.0.0.1:9000
        nginx_rate_limit_enabled: true
        nginx_verify_after_converge: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
