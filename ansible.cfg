# Project-local configuration. Ansible reads ansible.cfg from the current
# directory, so every one of these settings applies only when you run from the
# repository root -- no surprises from a stale ~/.ansible.cfg.
#
# Run `ansible-config dump --only-changed` to see exactly what differs from
# the defaults on your machine.

[defaults]
inventory                   = inventories/dev/hosts.yml
roles_path                  = roles
collections_path            = collections
library                     = plugins/modules
filter_plugins              = plugins/filter
host_key_checking           = True
interpreter_python          = auto_silent
# `stdout_callback = yaml` used to mean community.general.yaml, which was
# removed in community.general 12. The replacement is the built-in default
# callback with result_format set, which needs no collection at all.
stdout_callback             = default
result_format               = yaml
# Show timing and a recap of the slowest tasks: the cheapest performance
# tooling Ansible has, and it is off by default.
callbacks_enabled           = profile_tasks, timer
# Print a task's name for the host it is running on while it runs.
display_skipped_hosts       = False
retry_files_enabled         = False
forks                       = 20
# Cache facts so a second playbook in the same session does not re-gather.
gathering                   = smart
fact_caching                = jsonfile
fact_caching_connection     = .ansible_cache/facts
fact_caching_timeout        = 7200
# Deprecation warnings are how you find out about a breaking change before it
# breaks. Leave them on.
deprecation_warnings        = True

[inventory]
# An inventory file that fails to parse should be an error, not a warning that
# silently leaves you targeting nothing.
unparsed_is_failed          = True

[privilege_escalation]
become                      = False
become_method               = sudo
become_ask_pass             = False

[ssh_connection]
# Pipelining removes one SSH round trip per task. It needs `requiretty` off in
# the target's sudoers, which is the default on modern distributions, and it is
# the single biggest easy speedup for a playbook with many tasks.
pipelining                  = True
# Reuse one SSH connection per host for the whole run.
ssh_args                    = -C -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
control_path_dir            = ~/.ansible/cp
# Keep the remote tmp dir out of /tmp when it is mounted noexec.
remote_tmp                  = /tmp/.ansible-${USER}/tmp

[persistent_connection]
command_timeout             = 60
connect_timeout             = 30
